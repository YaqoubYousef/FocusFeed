name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project FocusFeed.xcodeproj \
            -target FocusFeed \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/FocusFeed.app Payload/
          zip -qry FocusFeed.ipa Payload

      - name: Write SideStore source
        env:
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python3 scripts/make_source.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" FocusFeed.ipa source.json \
            --title "FocusFeed $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: FocusFeed-ipa
          path: FocusFeed.ipa
